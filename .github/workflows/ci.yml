name: CI - Build & Quality Check

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]

jobs:
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Application (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/.htaccess || exit 1
          echo "✅ Build verified successfully! Dist files ready."

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sekaos-build-${{ github.sha }}
          path: dist/
          retention-days: 7
